aid: granted
name: Granted
description: 'Granted is an AI-plus-human healthcare navigation service that helps consumers
  reduce medical bills and manage health insurance. The platform detects billing errors
  (duplicate line items, up-coding, incorrect charges), finds unadvertised financial-assistance
  programs, negotiates discounts, optimizes insurance benefits, and manages claims communication
  across more than 1,300 insurance companies and patient portals. It runs on a success-based
  model that is free to use, charging only when it saves the user money (capped at $300
  per bill or 10% of savings). Granted is a Forerunner Ventures portfolio company operating
  in the consumer health / medical-billing sector. It publishes a consumer web and iOS
  app rather than a public developer API.'
